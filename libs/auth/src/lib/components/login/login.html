<div class="login-page">
  <main class="login-panel" aria-label="Employee management sign in">
    <div class="login-card">
      <header class="login-header">
        <h1>Sign in</h1>
      </header>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >

        <app-input-field
          [field]="emailField"
          formControlName="email"
        ></app-input-field>

        <app-input-field
          [field]="passwordField"
          formControlName="password"
        ></app-input-field>

        @if (loginError) {
          <div class="login-error">
            {{ loginError }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Sign in
        </button>

        <div class="signup-link">
          <span>Don't have an account?</span>
          <button
            type="button"
            class="link-button"
            (click)="goToSignup()"
          >
            Create Account
          </button>
        </div>
      </form>

    </div>
  </main>
</div>
