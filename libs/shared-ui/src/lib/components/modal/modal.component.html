<div class="modal" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2>
          {{ title() }}
        </h2>

        @if (description()) {
          <p>
            {{ description() }}
          </p>
        }
      </div>

      <button type="button" class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <ng-content></ng-content>
  </div>
</div>
